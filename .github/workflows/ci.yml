name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Typecheck, test & build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build (dual CJS + ESM)
        run: npm run build

      - name: E2E battle test (fake Lavalink over real sockets)
        run: node scripts/e2e.mjs

      - name: Battle-bot dry run (package installability)
        working-directory: examples/battle-bot
        run: |
          npm install --no-audit --no-fund
          npm run dry

  package:
    name: Package preview
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Pack
        run: npm pack --pack-destination /tmp

      - name: Tarball install smoke (CJS + ESM)
        run: |
          mkdir -p /tmp/pack-check && cd /tmp/pack-check
          npm init -y >/dev/null
          npm install /tmp/junie-*.tgz --no-audit --no-fund
          node -e "require('junie'); console.log('CJS OK')"
          node --input-type=module -e "import('junie').then(() => console.log('ESM OK'))"
